name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install light dependencies
        # Only the service + test deps: the QLoRA stack (torch, transformers,
        # peft, trl, datasets, accelerate, bitsandbytes) is deliberately
        # excluded here to keep CI fast and hardware-agnostic.
        run: |
          pip install fastapi "uvicorn[standard]" pydantic pytest httpx coverage

      - name: Run tests
        run: |
          coverage run -m pytest -v
          coverage report
